# Terraform Provider testing workflow.
#
# Runs on plain GitHub-hosted `ubuntu-latest` runners — this is a public
# repo under twilio-labs, so self-hosted runners aren't used (fork PRs could
# run attacker-controlled code against internal infrastructure), and there's
# no locked-down egress here: real internet access, so the marketplace
# actions below (hashicorp/setup-terraform, golangci-lint-action) and plain
# `go install`/`go mod download` all work as-is.
#
# Checked real conventions across github.com/twilio-labs before writing
# this: `ubuntu-latest` is the norm (85 hits vs. 2 for `ubuntu-x64`, which is
# only used by workflows deploying into Twilio's own internal
# infrastructure — not applicable here). SHA-pinning isn't required org-wide
# here (unlike twilio-internal), but it's kept below anyway as better
# security practice at no cost.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: 'v2.13.1'

jobs:
  # Ensure project builds, vets, and lints cleanly before running the test matrix.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - run: go vet ./...
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: '${{ env.GOLANGCI_LINT_VERSION }}'

  # Unit tests never touch the network and need no credentials.
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go test -v -cover ./...

  # Regenerate docs and fail if that produces an uncommitted diff, so
  # generated docs can never silently drift from the schema.
  generate:
    name: Generate Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' and commit the result."; exit 1)

  # Acceptance tests make real calls against a live SendGrid account and
  # need repository secrets, which forked-PR and Dependabot-triggered runs
  # don't receive (SENDGRID_API_KEY resolves empty and every call fails
  # with "authorization required"). Run only on pushes to main, where
  # secrets are available, so this workflow still finishes successfully
  # for ordinary PRs without silently skipping real coverage forever.
  acceptance-test:
    name: Acceptance Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        terraform:
          - '1.9.8'
          - '1.15.9'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '${{ matrix.terraform }}'
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: '1'
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: go test -v -cover ./internal/provider/...
        timeout-minutes: 20
