# Terraform Provider testing workflow.
#
# Runs on GitHub-hosted `ubuntu-latest` runners with real internet access, so
# plain `go install`/`go mod download`/`curl` all work as-is. This repo is
# CURRENTLY STILL PRIVATE, and jobs will sit queued indefinitely until it
# goes public: confirmed by testing the org's `twilio-labs-ubuntu-latest-slim`
# self-hosted runner directly — it picked up the job but hung on
# `actions/setup-go` until the job's timeout, i.e. it has the same
# locked-down egress (no toolchain-download access) as twilio-internal's
# self-hosted pool. GitHub-hosted `ubuntu-latest` is the correct target for
# when this repo goes public (self-hosted is denied on public repos —
# fork PRs could run attacker-controlled code against internal
# infrastructure — and public repos get GitHub-hosted runners instead), it
# just won't actually execute until then.
#
# Every `uses:` below is actions/* (GitHub-owned) — golangci-lint and
# Terraform are installed via plain shell instead of marketplace actions
# (golangci/golangci-lint-action, hashicorp/setup-terraform) because
# Twilio's GitHub Actions allowlist is enterprise-wide, not scoped to
# private/self-hosted repos: it only permits actions from GitHub, from an
# enterprise-owned repo, or an explicit exception list, regardless of the
# repo being public or the runner being GitHub-hosted. Confirmed by an
# actual failed run on this repo: "golangci/golangci-lint-action@... and
# hashicorp/setup-terraform@... are not allowed ... actions must be from a
# repository owned by your enterprise or created by GitHub."
#
# Checked real conventions across github.com/twilio-labs before writing
# this: `ubuntu-latest` is the norm (85 hits vs. 2 for `ubuntu-x64`, which is
# only used by workflows deploying into Twilio's own internal
# infrastructure — not applicable here).
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: 'v2.13.1'

jobs:
  # Ensure project builds, vets, and lints cleanly before running the test matrix.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - run: go vet ./...
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: Run linters
        run: golangci-lint run

  # Unit tests never touch the network and need no credentials.
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go test -v -cover ./...

  # Regenerate docs and fail if that produces an uncommitted diff, so
  # generated docs can never silently drift from the schema.
  generate:
    name: Generate Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TERRAFORM_VERSION: '1.15.9'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install Terraform
        run: |
          curl -fsSL -o terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          sudo unzip -o terraform.zip -d /usr/local/bin
          rm terraform.zip
          terraform version
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' and commit the result."; exit 1)

  # Acceptance tests make real calls against a live SendGrid account and
  # need repository secrets, which forked-PR and Dependabot-triggered runs
  # don't receive (SENDGRID_API_KEY resolves empty and every call fails
  # with "authorization required"). Run only on pushes to main, where
  # secrets are available, so this workflow still finishes successfully
  # for ordinary PRs without silently skipping real coverage forever.
  acceptance-test:
    name: Acceptance Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        terraform:
          - '1.9.8'
          - '1.15.9'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install Terraform ${{ matrix.terraform }}
        run: |
          curl -fsSL -o terraform.zip \
            "https://releases.hashicorp.com/terraform/${{ matrix.terraform }}/terraform_${{ matrix.terraform }}_linux_amd64.zip"
          sudo unzip -o terraform.zip -d /usr/local/bin
          rm terraform.zip
          terraform version
      - run: go mod download
      - env:
          TF_ACC: '1'
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: go test -v -cover ./internal/provider/...
        timeout-minutes: 20
